<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ophthalmology QBank 501Q (Shuffled Options)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surf:#161b22;--surf2:#1c2128;--bdr:#30363d;
  --blue:#58a6ff;--green:#3fb950;--red:#f85149;--yel:#d29922;--pur:#bc8cff;--org:#f0883e;
  --t1:#e6edf3;--t2:#8b949e;--t3:#6e7681;
}
body{background:var(--bg);color:var(--t1);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--blue);z-index:999}
#bar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
#bar h1{font-size:1rem;color:var(--blue);font-weight:700}
.bst{display:flex;gap:14px;font-size:.75rem;color:var(--t2);align-items:center}
.bst b{color:var(--t1)}
#mobt{display:none;background:var(--surf2);border:1px solid var(--bdr);color:var(--t2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:.75rem}
@media(max-width:700px){#mobt{display:block}.bst{display:none}}
#wrap{display:flex;min-height:calc(100vh - 45px)}
#side{width:240px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);padding:14px 12px;overflow-y:auto;height:calc(100vh - 45px);position:sticky;top:45px}
@media(max-width:700px){#side{display:none;position:fixed;top:45px;left:0;right:0;bottom:0;z-index:50;width:100%;height:auto;overflow-y:auto}#side.open{display:block}}
.sl{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);margin:14px 0 5px;font-weight:600}
.sb{display:block;width:100%;text-align:left;background:none;border:none;color:var(--t2);font-size:.76rem;padding:5px 8px;border-radius:4px;cursor:pointer;transition:.12s}
.sb:hover{background:var(--surf2);color:var(--t1)}
.sb.on{background:rgba(88,166,255,.13);color:var(--blue);border-left:2px solid var(--blue);padding-left:6px}
.sc{float:right;color:var(--t3);font-size:.65rem}
#ss{width:100%;background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;color:var(--t1);font-size:.78rem;padding:6px 9px;outline:none}
#ss:focus{border-color:var(--blue)}
#ss::placeholder{color:var(--t3)}
.pw{background:var(--surf2);border-radius:3px;height:5px;margin:6px 0}
.pf{background:linear-gradient(90deg,var(--blue),var(--green));height:100%;border-radius:3px;transition:.3s}
#ptxt{font-size:.68rem;color:var(--t3)}
#main{flex:1;padding:20px;overflow-y:auto;min-width:0}
#sbar{max-width:760px;margin:0 auto 16px;background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.si{font-size:.74rem;color:var(--t2);display:flex;align-items:center;gap:5px}
.sn{font-size:1rem;font-weight:700}
.sn.g{color:var(--green)}.sn.r{color:var(--red)}.sn.b{color:var(--blue)}
#stk{margin-left:auto;font-size:.78rem;color:var(--org);font-weight:600}
#ctrls{max-width:760px;margin:0 auto 14px;display:flex;gap:7px;flex-wrap:wrap}
.cb{background:var(--surf);border:1px solid var(--bdr);color:var(--t2);font-size:.72rem;padding:5px 11px;border-radius:5px;cursor:pointer;transition:.12s}
.cb:hover{border-color:var(--blue);color:var(--blue)}
.cb.on{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.08)}
#card{max-width:760px;margin:0 auto;background:var(--surf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
#ch{background:var(--surf2);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:8px}
.cm{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tag{border-radius:4px;padding:2px 8px;font-size:.68rem;font-weight:600}
.tn{background:var(--surf);border:1px solid var(--bdr);color:var(--t3)}
.tt{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);color:var(--blue)}
.tE{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.25);color:var(--green)}
.tM{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.25);color:var(--yel)}
.tH{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.25);color:var(--red)}
.tV{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);color:var(--green);font-size:.65rem}
.tA{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.2);color:var(--yel);font-size:.65rem}
#fb{background:none;border:none;cursor:pointer;color:var(--t3);font-size:.9rem;padding:3px 6px}
#fb.on{color:var(--yel)}
#cbody{padding:22px 22px 18px}
#qt{font-size:1rem;line-height:1.75;color:var(--t1);margin-bottom:22px}
#ow{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--surf2);border:1px solid var(--bdr);border-radius:7px;color:var(--t1);font-size:.84rem;line-height:1.5;padding:11px 14px;cursor:pointer;transition:.18s}
.opt:hover:not([disabled]){border-color:var(--blue);background:rgba(88,166,255,.06)}
.ol{min-width:22px;height:22px;border-radius:4px;background:var(--bdr);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;margin-top:1px}
.opt.ri{border-color:var(--green)!important;background:rgba(63,185,80,.08)!important}
.opt.ri .ol{background:var(--green);color:#000}
.opt.wr{border-color:var(--red)!important;background:rgba(248,81,73,.08)!important}
.opt.wr .ol{background:var(--red);color:#fff}
.opt.sr{border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.04)}
.opt.sr .ol{background:rgba(63,185,80,.25);color:var(--green)}
#rvb{width:100%;padding:11px;background:none;border:1px solid var(--blue);border-radius:7px;color:var(--blue);font-size:.84rem;cursor:pointer;transition:.18s;margin-bottom:14px}
#rvb:hover{background:rgba(88,166,255,.08)}
#ab{display:none;margin-top:14px}
.as{background:var(--surf2);border:1px solid var(--bdr);border-radius:7px;padding:14px;margin-bottom:10px}
.al{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:7px;font-weight:600}
.act{color:var(--green);font-size:.93rem;line-height:1.6;font-weight:500}
.aex{color:var(--t1);font-size:.8rem;line-height:1.65;white-space:pre-wrap}
.awr{color:var(--t2);font-size:.78rem;line-height:1.6;white-space:pre-wrap}
.apr{background:rgba(188,140,255,.06);border:1px solid rgba(188,140,255,.2);border-radius:7px;padding:12px 14px;margin-bottom:10px}
.apt{font-size:.8rem;color:var(--t1);line-height:1.55}
.cbg{display:inline-block;border-radius:4px;padding:2px 9px;font-size:.68rem;font-weight:600;margin-top:6px}
#cn{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:10px}
.nb{background:var(--surf2);border:1px solid var(--bdr);color:var(--t1);font-size:.8rem;padding:7px 15px;border-radius:6px;cursor:pointer;transition:.12s}
.nb:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.nb:disabled{opacity:.3;cursor:not-allowed}
#ni{text-align:center;font-size:.75rem;color:var(--t2)}
#skb{background:none;border:none;color:var(--t3);font-size:.72rem;cursor:pointer;text-decoration:underline;margin-top:3px;display:block}
#skb:hover{color:var(--t2)}
#empty{display:none;max-width:760px;margin:60px auto;text-align:center;color:var(--t2)}
#empty h3{font-size:1.1rem;margin-bottom:8px;color:var(--t1)}
</style>
</head>
<body>
<div id="loading">Loading 501 questions…</div>
<div id="bar">
  <h1>&#128065; Ophthalmology QBank</h1>
  <div class="bst">
    <span>&#10003; <b id="bc">0</b></span>
    <span>&#10007; <b id="bw">0</b></span>
    <span>501 total</span>
    <button id="mobt" onclick="document.getElementById('side').classList.toggle('open')">&#9776; Filter</button>
  </div>
</div>
<div id="wrap">
  <div id="side">
    <div class="sl">Search</div>
    <input id="ss" placeholder="Search questions…" oninput="doSearch(this.value)">
    <div class="sl">Mode</div>
    <button class="sb on" id="m-all"        onclick="setMode('all')">All Questions        <span class="sc" id="c-all">501</span></button>
    <button class="sb"    id="m-mcq"        onclick="setMode('mcq')">MCQ Only             <span class="sc" id="c-mcq">211</span></button>
    <button class="sb"    id="m-wrong"      onclick="setMode('wrong')">Incorrect Only     <span class="sc" id="c-wr">0</span></button>
    <button class="sb"    id="m-flagged"    onclick="setMode('flagged')">Flagged           <span class="sc" id="c-fl">0</span></button>
    <button class="sb"    id="m-unanswered" onclick="setMode('unanswered')">Unanswered    <span class="sc" id="c-un">501</span></button>
    <div class="sl">Topic</div>
    <div id="tlist"></div>
    <div class="sl">Difficulty</div>
    <button class="sb on" id="d-all"    onclick="setDiff('all')">All</button>
    <button class="sb"    id="d-Easy"   onclick="setDiff('Easy')">Easy</button>
    <button class="sb"    id="d-Medium" onclick="setDiff('Medium')">Medium</button>
    <button class="sb"    id="d-Hard"   onclick="setDiff('Hard')">Hard</button>
    <div class="sl">Progress</div>
    <div class="pw"><div class="pf" id="pf" style="width:0%"></div></div>
    <div id="ptxt">0 / 501 answered</div>
    <div class="sl">Actions</div>
    <button class="sb" id="rndb" onclick="toggleRandom()">&#8644; Random: OFF</button>
    <button class="sb" style="color:var(--red)" onclick="resetAll()">&#8635; Reset Progress</button>
  </div>
  <div id="main">
    <div id="sbar">
      <div class="si">Score: <span class="sn b" id="scp">-</span></div>
      <div class="si">&#10003; <span class="sn g" id="scc">0</span></div>
      <div class="si">&#10007; <span class="sn r" id="scw">0</span></div>
      <div class="si">&#8631; <span class="sn" id="scs">0</span> skipped</div>
      <span id="stk"></span>
    </div>
    <div id="ctrls">
      <button class="cb" onclick="goTo(0)">&#9196; First</button>
      <button class="cb" onclick="goTo(fids.length-1)">&#9197; Last</button>
      <button class="cb" id="cbr" onclick="toggleRandom()">&#8644; Random</button>
      <button class="cb" onclick="jumpTo()">Jump to #</button>
    </div>
    <div id="card">
      <div id="ch">
        <div class="cm">
          <span class="tag tn" id="tnum">#1</span>
          <span class="tag tt" id="ttop"></span>
          <span class="tag"    id="tdif"></span>
          <span class="tag"    id="tcnf"></span>
        </div>
        <button id="fb" onclick="toggleFlag()" title="Flag for review">&#9873;</button>
      </div>
      <div id="cbody">
        <div id="qt"></div>
        <div id="ow"></div>
        <button id="rvb" style="display:none" onclick="revealAns()">&#9654; Reveal Answer</button>
        <div id="ab">
          <div class="as"><div class="al">Correct Answer</div><div class="act" id="aac"></div></div>
          <div class="as" id="aes" style="display:none"><div class="al">Why This Is Correct</div><div class="aex" id="aex"></div></div>
          <div class="as" id="aws" style="display:none"><div class="al">Why Other Choices Are Wrong</div><div class="awr" id="awr"></div></div>
          <div class="apr" id="aps" style="display:none"><div class="al" style="color:var(--pur)">High-Yield Pearl</div><div class="apt" id="apt"></div></div>
          <span class="cbg" id="acnf"></span>
        </div>
      </div>
      <div id="cn">
        <button class="nb" id="pvb" onclick="move(-1)">&#8592; Prev</button>
        <div id="ni"><span id="npos"></span><button id="skb" onclick="skip()">Skip &#8594;</button></div>
        <button class="nb" id="nxb" onclick="move(1)">Next &#8594;</button>
      </div>
    </div>
    <div id="empty"><h3>No questions match</h3><p>Try adjusting filters or search.</p></div>
  </div>
</div>

var ansArr  = new Int16Array(RAW.length).fill(-1);
var corrArr = new Int8Array(RAW.length).fill(-1);
var flagArr = new Uint8Array(RAW.length);

(function(){
  try {
    var s = JSON.parse(localStorage.getItem('ophtho5') || 'null');
    if(!s) return;
    if(s.a) for(var i=0;i<s.a.length;i++) ansArr[i]=s.a[i];
    if(s.c) for(var i=0;i<s.c.length;i++) corrArr[i]=s.c[i];
    if(s.f) for(var i=0;i<s.f.length;i++) flagArr[i]=s.f[i];
  } catch(e){}
})();

function save(){
  try {
    localStorage.setItem('ophtho5', JSON.stringify({
      a:Array.from(ansArr), c:Array.from(corrArr), f:Array.from(flagArr)
    }));
  } catch(e){}
}

var curMode = 'all';
var curTopic = 'all';
var curDiff = 'all';
var curSearch = '';
var randomMode = false;
var streak = 0;
var skipped = 0;
var fids = [];
var cur = 0;

function getFiltered(){
  var out = [];
  for(var i=0;i<RAW.length;i++){
    var q = RAW[i];
    if(curMode === 'mcq'       && !(q.opts && q.opts.length > 1)) continue;
    if(curMode === 'wrong'     && corrArr[i] !== 0) continue;
    if(curMode === 'flagged'   && !flagArr[i]) continue;
    if(curMode === 'unanswered'&& corrArr[i] !== -1) continue;
    if(curTopic !== 'all'      && q.topic !== curTopic) continue;
    if(curDiff  !== 'all'      && q.diff  !== curDiff)  continue;
    if(curSearch){
      var s = curSearch.toLowerCase();
      if(q.q.toLowerCase().indexOf(s) < 0 && q.topic.toLowerCase().indexOf(s) < 0) continue;
    }
    out.push(i);
  }
  return out;
}

function applyFilter(){
  fids = getFiltered();
  if(randomMode) shuffle(fids);
  cur = 0;
  render();
  updateSide();
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
}

var LABELS = ['A','B','C','D','E'];

// Per-question shuffled option order: optOrder[ri] = [shuffled indices into q.opts]
var optOrder = {};
function getOptOrder(ri, numOpts){
  if(!optOrder[ri]){
    var ord = [];
    for(var k=0;k<numOpts;k++) ord.push(k);
    // Fisher-Yates shuffle
    for(var k=ord.length-1;k>0;k--){
      var j=Math.floor(Math.random()*(k+1));
      var t=ord[k];ord[k]=ord[j];ord[j]=t;
    }
    optOrder[ri] = ord;
  }
  return optOrder[ri];
}

function render(){
  var card  = document.getElementById('card');
  var empty = document.getElementById('empty');
  if(fids.length === 0){
    card.style.display  = 'none';
    empty.style.display = 'block';
    return;
  }
  card.style.display  = 'block';
  empty.style.display = 'none';

  var ri = fids[cur];
  var q  = RAW[ri];
  var answered = (corrArr[ri] !== -1);

  document.getElementById('tnum').textContent = '#'+(cur+1)+' / '+fids.length;
  document.getElementById('ttop').textContent = q.topic;

  var td = document.getElementById('tdif');
  td.textContent = q.diff;
  td.className = 'tag t' + q.diff.charAt(0);

  var tc = document.getElementById('tcnf');
  tc.textContent = (q.conf === 'VERIFIED') ? 'VERIFIED' : 'AI';
  tc.className = 'tag ' + (q.conf === 'VERIFIED' ? 'tV' : 'tA');

  document.getElementById('fb').className = flagArr[ri] ? 'on' : '';
  document.getElementById('qt').textContent = q.q;

  var ow  = document.getElementById('ow');
  var rvb = document.getElementById('rvb');
  var ab  = document.getElementById('ab');
  ow.innerHTML = '';
  rvb.style.display = 'none';
  ab.style.display  = 'none';

  if(q.opts && q.opts.length > 1){
    var ord = getOptOrder(ri, q.opts.length);
    for(var i=0;i<ord.length;i++){
      (function(displayPos, realIdx){
        var btn = document.createElement('button');
        btn.className = 'opt';
        var lbl = document.createElement('span');
        lbl.className = 'ol';
        lbl.textContent = LABELS[displayPos];
        var txt = document.createElement('span');
        txt.textContent = q.opts[realIdx];
        btn.appendChild(lbl);
        btn.appendChild(txt);
        if(answered){
          btn.disabled = true;
          if(realIdx === q.ai){
            btn.classList.add(ansArr[ri] === realIdx ? 'ri' : 'sr');
          } else if(realIdx === ansArr[ri]){
            btn.classList.add('wr');
          }
        } else {
          btn.addEventListener('click', (function(r,ii){ return function(){ pick(r,ii); }; })(ri,realIdx));
        }
        ow.appendChild(btn);
      })(i, ord[i]);
    }
    document.getElementById('skb').style.display = answered ? 'none' : 'block';
    if(answered) showAns(ri);
  } else {
    if(answered){
      showAns(ri);
    } else {
      rvb.style.display = 'block';
      document.getElementById('skb').style.display = 'block';
    }
  }

  document.getElementById('pvb').disabled = (cur === 0);
  document.getElementById('nxb').disabled = (cur === fids.length-1);
  document.getElementById('npos').textContent = (cur+1) + ' of ' + fids.length;
  updateScorebar();
}

function showAns(ri){
  var q   = RAW[ri];
  var ab  = document.getElementById('ab');
  ab.style.display = 'block';

  var ansText = q.ans || (q.opts && q.opts[q.ai] ? q.opts[q.ai] : '');
  document.getElementById('aac').textContent = ansText || 'See explanation';

  var aes = document.getElementById('aes');
  if(q.exp){ aes.style.display='block'; document.getElementById('aex').textContent=q.exp; }
  else { aes.style.display='none'; }

  var aws = document.getElementById('aws');
  if(q.wr){ aws.style.display='block'; document.getElementById('awr').textContent=q.wr; }
  else { aws.style.display='none'; }

  var aps = document.getElementById('aps');
  if(q.pl){ aps.style.display='block'; document.getElementById('apt').textContent=q.pl; }
  else { aps.style.display='none'; }

  var cbg = document.getElementById('acnf');
  cbg.textContent = (q.conf === 'VERIFIED') ? 'Teacher-Verified' : 'AI-Verified';
  cbg.className   = 'cbg ' + (q.conf === 'VERIFIED' ? 'tV' : 'tA');
}

function pick(ri, i){
  ansArr[ri]  = i;
  corrArr[ri] = (i === RAW[ri].ai) ? 1 : 0;
  streak = (corrArr[ri] === 1) ? streak + 1 : 0;
  save();
  render();
  updateSide();
  if(corrArr[ri] === 1 && cur < fids.length-1){
    setTimeout(function(){ move(1); }, 1400);
  }
}

function revealAns(){
  var ri = fids[cur];
  ansArr[ri]  = RAW[ri].ai;
  corrArr[ri] = 1;
  save(); render(); updateSide();
}

function skip(){ skipped++; if(cur < fids.length-1) move(1); }
function move(d){ cur = Math.max(0, Math.min(fids.length-1, cur+d)); render(); }
function goTo(n){ cur = Math.max(0, Math.min(fids.length-1, n)); render(); }
function jumpTo(){
  var n = parseInt(prompt('Jump to question (1-'+fids.length+'):'));
  if(!isNaN(n) && n>=1 && n<=fids.length){ cur = n-1; render(); }
}
function toggleFlag(){
  var ri = fids[cur];
  flagArr[ri] = flagArr[ri] ? 0 : 1;
  save(); render(); updateSide();
}
function toggleRandom(){
  randomMode = !randomMode;
  document.getElementById('rndb').textContent = randomMode ? 'Random: ON' : 'Random: OFF';
  document.getElementById('cbr').classList.toggle('on', randomMode);
  applyFilter();
}
function resetAll(){
  if(!confirm('Reset all progress?')) return;
  ansArr.fill(-1); corrArr.fill(-1); flagArr.fill(0);
  streak = 0; skipped = 0;
  optOrder = {};
  localStorage.removeItem('ophtho5');
  applyFilter();
}

function setMode(m){
  curMode = m;
  var modes = ['all','mcq','wrong','flagged','unanswered'];
  for(var i=0;i<modes.length;i++){
    var el = document.getElementById('m-'+modes[i]);
    if(el) el.classList.toggle('on', modes[i] === m);
  }
  applyFilter();
}

function setTopic(t){
  curTopic = t;
  var btns = document.querySelectorAll('.tbtn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
  var eid = t.replace(/[^a-zA-Z0-9]/g, '_');
  var el = document.getElementById('tf-'+eid);
  if(el) el.classList.add('on');
  applyFilter();
}

function setDiff(d){
  curDiff = d;
  var diffs = ['all','Easy','Medium','Hard'];
  for(var i=0;i<diffs.length;i++){
    var el = document.getElementById('d-'+diffs[i]);
    if(el) el.classList.toggle('on', diffs[i] === d);
  }
  applyFilter();
}

function doSearch(v){ curSearch = v; applyFilter(); }

function updateSide(){
  var c=0, w=0, f=0, done=0;
  for(var i=0;i<RAW.length;i++){
    if(corrArr[i]===1) c++;
    if(corrArr[i]===0) w++;
    if(flagArr[i]) f++;
    if(corrArr[i]!==-1) done++;
  }
  document.getElementById('c-wr').textContent = w;
  document.getElementById('c-fl').textContent = f;
  document.getElementById('c-un').textContent = RAW.length - done;
  var pct = Math.round(done / RAW.length * 100);
  document.getElementById('pf').style.width   = pct + '%';
  document.getElementById('ptxt').textContent = done + ' / ' + RAW.length + ' answered';
  document.getElementById('bc').textContent   = c;
  document.getElementById('bw').textContent   = w;
}

function updateScorebar(){
  var c=0, w=0;
  for(var i=0;i<RAW.length;i++){
    if(corrArr[i]===1) c++;
    if(corrArr[i]===0) w++;
  }
  var tot = c+w;
  document.getElementById('scp').textContent = tot ? Math.round(c/tot*100)+'%' : '-';
  document.getElementById('scc').textContent = c;
  document.getElementById('scw').textContent = w;
  document.getElementById('scs').textContent = skipped;
  document.getElementById('stk').textContent = streak>=3 ? '🔥 '+streak+' streak!' : '';
}

// Build topic sidebar using pure DOM — no string-embedded onclick
(function buildTopics(){
  var cnt = {};
  for(var i=0;i<RAW.length;i++){
    var t = RAW[i].topic;
    cnt[t] = (cnt[t]||0) + 1;
  }
  var sorted = Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; });
  var tlist = document.getElementById('tlist');

  function makeTopicBtn(label, topicVal, count, isAll){
    var btn = document.createElement('button');
    btn.className = isAll ? 'sb tbtn on' : 'sb tbtn';
    btn.id = 'tf-' + topicVal.replace(/[^a-zA-Z0-9]/g, '_');
    var span = document.createElement('span');
    span.className = 'sc';
    span.textContent = count;
    btn.textContent = label + ' ';
    btn.appendChild(span);
    btn.addEventListener('click', (function(tv){ return function(){ setTopic(tv); }; })(topicVal));
    return btn;
  }

  tlist.appendChild(makeTopicBtn('All Topics', 'all', RAW.length, true));
  for(var i=0;i<sorted.length;i++){
    tlist.appendChild(makeTopicBtn(sorted[i], sorted[i], cnt[sorted[i]], false));
  }
})();

// Keyboard shortcuts
document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight' || e.key === 'l') move(1);
  else if(e.key === 'ArrowLeft' || e.key === 'h') move(-1);
  else if(e.key === 'f') toggleFlag();
  else if(e.key === 'r' || e.key === ' '){ e.preventDefault(); revealAns(); }
  else if(e.key >= '1' && e.key <= '5'){
    var ri = fids[cur];
    if(ri !== undefined && RAW[ri].opts && RAW[ri].opts.length > 1 && corrArr[ri] === -1){
      pick(ri, parseInt(e.key)-1);
    }
  }
});

document.getElementById('loading').style.display = 'none';
applyFilter();

</script>
